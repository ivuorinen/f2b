# golangci-lint configuration for f2b project
# https://golangci-lint.run/usage/configuration/

version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
  go: "1.21"

linters:
  enable:
    # Essential linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Code quality linters
    - misspell
    - unconvert
    - gocyclo
    - prealloc
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - durationcheck
    - errorlint
    - predeclared
    - wastedassign
    - containedctx
    - contextcheck
    - errname
    - nilnil
    - thelper
    - usestdlibvars

  disable:
    # Disable overly strict linters for this project
    - varnamelen # Variable name length checking
    - tagliatelle # Struct tag format checking
    - makezero
    - testpackage # Separate test package requirement
    - paralleltest # Parallel test requirement
    - forcetypeassert # Force type assertion
    - ireturn # Return interface checking
    - nlreturn # New line return checking
    - cyclop # Cyclomatic complexity (covered by gocyclo)
    - funlen # Function length checking
    - gocognit # Cognitive complexity checking
    - maintidx # Maintainability index
    - nestif # Nested if checking
    - lll # Line length checking
    - godox # TODO/FIXME/etc comments
    - wsl # Whitespace linter (too strict)
    - gocritic # Too many style opinions
    - whitespace # Whitespace checking
    - nakedret # Naked returns
    - nolintlint # Nolint directive checking
    - noctx # Context checking

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
    exclude-functions:
      - (*os.File).Close
      - (io.Closer).Close


  govet:
    enable-all: true
    disable:
      - fieldalignment # Can be too strict for simple structs
      - shadow # Variable shadowing can be acceptable

  gocyclo:
    min-complexity: 20

  misspell:
    locale: US

  prealloc:
    simple: true
    range-loops: true
    for-loops: false

  errorlint:
    errorf: false # Allow %v instead of %w for some cases

issues:
  exclude-use-default: false
  exclude:
    # Exclude some common false positives
    - "Error return value of .* is not checked"
    - "exported (type|method|function) .* should have comment or be unexported"
    - "should have a package comment"
    - "unused-parameter.*cmd.*cobra.Command" # Cobra command parameters
    - "G204.*fail2ban" # Allow subprocess calls for fail2ban
    - "shadow.*err" # Allow error variable shadowing

  exclude-rules:
    - path: fail2ban/fail2ban.go
      linters:
        - errcheck
      text: "G204|G304"

    # Exclude some linters for test files
    - path: _test\.go
      linters:
        - errcheck
        - unparam
        - funlen
        - gocyclo

    # Exclude main.go from some checks
    - path: main\.go
      linters:

    # Exclude command files from unused parameter checks
    - path: cmd/.*\.go
      linters:
      text: "unused-parameter.*cmd.*cobra.Command"

  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  fix: false
