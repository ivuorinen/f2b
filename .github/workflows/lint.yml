---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint

on:
  push:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Go and every tool come from mise.toml (Go through go.mod), so CI runs the same
# versions and the same tasks as local runs and the git hooks. mise itself is
# pinned: an unpinned tool changes CI behaviour without a commit. Renovate bumps
# it via the customManagers:githubActionsVersions preset, and the tools via
# mise.toml.
env:
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: v2026.10.21

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Lint (gofmt, go vet, golangci-lint)
        run: mise run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Run tests
        run: mise run test-race
