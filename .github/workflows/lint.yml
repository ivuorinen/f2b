---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint

on:
  push:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.x

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.x"

      - name: Add GOPATH/bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install tools required by pre-commit
        shell: bash
        run: make dev-setup

      - name: Verify golangci-lint version
        shell: bash
        run: |
          which golangci-lint
          golangci-lint version
          INSTALLED_VERSION=$(golangci-lint version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ "$INSTALLED_VERSION" != "2.7.2" ]; then
            echo "ERROR: Expected golangci-lint v2.7.2, got v$INSTALLED_VERSION"
            exit 1
          fi
          echo "✓ golangci-lint v$INSTALLED_VERSION is correctly installed"

      - name: Run pre-commit
        shell: bash
        run: pre-commit run --all-files --show-diff-on-failure --color=always
