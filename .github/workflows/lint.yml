name: Lint

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod

      - name: Run Go linters
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          if [ -s /tmp/gofmt.out ]; then
            echo "The following files need formatting:"
            cat /tmp/gofmt.out
            exit 1
          fi
          go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          args: --timeout=5m

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@b7c9edd8dcdc93928ccb82cff44a3d0e616a9684 # v18.0.1
        with:
          globs: '*.md'
          continue-on-error: true

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: .github/workflows/
          strict: false

      - name: Run actionlint
        uses: rhymond/actionlint-action@b30931e8f832b5ca47b369c1b51c19df6a121b86 # v1.1.17
        with:
          fail-on-error: false

      - name: Run editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@d4fca16fc71adef10fdbe825e4a3a4374a2c4199 # v2.0.3
        with:
          continue-on-error: true
