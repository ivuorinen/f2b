---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Sync labels

on:
  push:
    branches:
      - main
    paths:
      - .github/labels.yml
  schedule:
    - cron: "34 5 * * *"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: ivuorinen/actions/sync-labels@dc85cef1c285edd3d2edcb4a7c82bdd08ccc7c56 # v2026.03.20
