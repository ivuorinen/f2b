---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Sync labels

on:
  push:
    branches:
      - main
    paths:
      - .github/labels.yml
  schedule:
    - cron: "34 5 * * *"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Push, cron and dispatch triggers can overlap; label rewrites must not race.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-labels:
    name: Sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # create, update and delete repository labels
    steps:
      - uses: ivuorinen/actions/sync-labels@9a311175b62e4871d83e682bf2e772d99e6d6f44 # v2026.10.23
