---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

# `mise run release` pushes the next CalVer tag; this workflow builds and signs.
on:
  push:
    tags:
      - "20*"

# One release at a time; a second tag waits instead of cancelling a release
# that may already have published assets.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

# goreleaser, cosign and Go come from mise.toml (Go through go.mod). mise itself
# is pinned; Renovate bumps it via the customManagers:githubActionsVersions
# preset.
env:
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: v2026.10.21

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # cosign keyless signing; no attestations, so no attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser builds the changelog from git history
          # goreleaser publishes through GITHUB_TOKEN in its environment and
          # only reads git history, so the token need not stay in git config.
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: ${{ env.MISE_VERSION }}
          # Signed release artifacts are built from fresh tool installs: a
          # restored cache is an input nothing in this job verifies.
          cache: false

      - name: Build, sign and publish
        run: mise run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
