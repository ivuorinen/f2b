---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint PR Code Base

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Go and every tool come from mise.toml (Go through go.mod), so CI runs the same
# versions and the same tasks as local runs and the git hooks. mise itself is
# pinned: an unpinned tool changes CI behaviour without a commit. Renovate bumps
# it via the customManagers:githubActionsVersions preset, and the tools via
# mise.toml.
env:
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: v2026.10.21

jobs:
  Linter:
    name: PR Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      statuses: write # Used by ivuorinen/actions/pr-lint to report check status
      contents: read
      packages: read # Used by ivuorinen/actions/pr-lint to pull its linter image from ghcr.io
      issues: write # Used by ivuorinen/actions/pr-lint
      pull-requests: write # Used by ivuorinen/actions/pr-lint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Lint (gofmt, go vet, golangci-lint)
        run: mise run lint

      # docs/api is generated and committed; a removed or renamed exported
      # symbol otherwise keeps its published documentation until an audit.
      - name: Generated API docs are current
        run: mise run docs-api && git diff --exit-code -- docs/api

      - name: Run race-enabled tests and collect coverage
        run: mise run test-cov

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.out

      - name: Run PR Lint
        # Custom PR linting action that performs additional PR-specific checks
        # https://github.com/ivuorinen/actions
        uses: ivuorinen/actions/pr-lint@7ade03bb39e406bc0876e000b08534418b6ca914 # v2026.08.28

  prek:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: ${{ env.MISE_VERSION }}

      # prek and every hook's tool come from mise.toml; the hooks pin nothing.
      - name: Run prek hooks
        run: mise run hooks
