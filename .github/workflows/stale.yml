---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Stale

on:
  schedule:
    - cron: "0 8 * * *" # Every day at 08:00
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The cron, dispatch and workflow_call triggers can overlap; two stale passes
# must not race on the same issues.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stale:
    name: 🧹 Clean up stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # only for delete-branch option
      issues: write # label and close stale issues
      pull-requests: write # label and close stale pull requests
    steps:
      - uses: ivuorinen/actions/stale@9a311175b62e4871d83e682bf2e772d99e6d6f44 # v2026.10.23
