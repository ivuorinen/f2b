#:schema https://mise.jdx.dev/schema/mise.json

# Go is not listed under [tools]: its version comes from the toolchain line in
# go.mod, which stays the single source of truth. Reading go.mod is off by
# default in mise, so it is enabled here for go alone.
[settings]
idiomatic_version_file_enable_tools = ["go"]

# Every tool the git hooks, the CI workflows and these tasks run is pinned here
# and only here, so all three run the same versions. Renovate's mise manager
# bumps them, so a version change is always a commit.
#
# The Go tools are built from source with the go.mod toolchain (the go:
# backend), not fetched as prebuilt binaries: golangci-lint refuses to lint code
# whose Go version is newer than the one it was built with.
[tools]
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.15.0"
"go:github.com/princjef/gomarkdoc/cmd/gomarkdoc" = "1.1.0"
"go:github.com/securego/gosec/v2/cmd/gosec" = "2.30.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
actionlint = "1.7.12"
checkov = "3.3.30"
editorconfig-checker = "4.0.2"
markdownlint-cli2 = "0.24.0"
# node runs the npm: tools; uv installs the pypi: tools.
node = "24.22.1"
"npm:markdown-link-check" = "3.15.0"
prek = "0.5.7"
"pypi:check-jsonschema" = "0.39.0"
# Renovate does not read `with`: bump mdformat-gfm by hand with mdformat.
"pypi:mdformat" = { version = "1.0.0", with = ["mdformat-gfm==1.0.0"] }
shfmt = "3.14.1"
uv = "0.13.6"
yamlfmt = "0.21.0"

[tasks.build]
description = "Build the f2b binary"
run = 'go build -ldflags "-X github.com/ivuorinen/f2b/cmd.Version=dev" -o f2b .'

[tasks.install]
description = "Install f2b from the working copy"
run = 'go install -ldflags "-X github.com/ivuorinen/f2b/cmd.Version=dev" .'

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.test-race]
description = "Run tests with the race detector"
run = "go test -race ./..."

[tasks.test-cov]
description = "Run race-enabled tests and write coverage.out"
run = "go test -race -covermode=atomic -coverprofile=coverage.out ./..."

[tasks.fmt]
description = "Format Go code"
run = "gofmt -w ."

# Checks formatting instead of rewriting it: `gofmt -w` always exits 0, so a
# violation would pass silently. The prek golangci-lint hook runs this task.
[tasks.lint]
description = "gofmt check, go vet and golangci-lint"
run = '''
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "gofmt reported unformatted files:"
  echo "$unformatted"
  exit 1
fi
go vet ./...
golangci-lint run --timeout=5m
'''

[tasks.hooks]
description = "Run every prek hook over the whole tree"
run = "prek run --all-files --show-diff-on-failure"

[tasks.setup]
description = "Install the prek git hooks"
run = "prek install"

# Reachability-aware: only fails on vulnerabilities this code can actually
# reach, unlike a plain dependency-version scan.
[tasks.vuln]
description = "Scan for reachable vulnerabilities with govulncheck"
run = "govulncheck ./..."

[tasks.security]
description = "Scan for security issues with gosec"
run = "gosec ./..."

# The root main package is not part of the public API, so it is skipped.
[tasks.docs-api]
description = "Generate the public API docs into docs/api/"
run = '''
mkdir -p docs/api
printf '# f2b API Reference\n\nGenerated by `mise run docs-api`; do not edit by hand.\n\n' > docs/api/index.md
for pkg in cmd constants fail2ban; do
  gomarkdoc --output "docs/api/$pkg.md" "./$pkg"
  echo "- [\`$pkg\`]($pkg.md)" >> docs/api/index.md
done
'''

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf f2b coverage.out dist/"

# --local keeps `mise upgrade` to this file; without it, it also rewrites the
# global mise config. Go itself is not bumped here: its version is the go.mod
# toolchain line, which Renovate moves.
[tasks.update]
description = "Update Go modules and mise tools to their latest versions"
run = ["go get -u -t ./...", "go mod tidy", "mise upgrade --bump --local"]

[tasks.all]
description = "Lint, race-enabled tests, vulnerability scan and build: the CI gates"
depends = ["lint", "test-race", "vuln", "build"]
