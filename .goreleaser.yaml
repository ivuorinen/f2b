---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy
    - sh scripts/collect-licenses.sh

builds:
  - binary: f2b
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ivuorinen/f2b/cmd.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    # 32-bit Raspberry Pi OS hosts, which commonly run fail2ban.
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm64

archives:
  # ivuorinen/homebrew-tap matches each binary by the os and arch in its name.
  - formats: [binary]
    name_template: >-
      {{- .ProjectName }}_{{ .Os }}-{{ .Arch }} {{- if .Arm }}v{{ .Arm }}{{ end }}

# The release notes are the project's changelog. The groups read the commit
# subject (the PR title, since PRs are squash merged), so a breaking change
# marked only by a BREAKING CHANGE footer is listed under its type.
changelog:
  sort: asc
  abbrev: 7
  filters:
    exclude:
      # Optional scope and breaking marker: commits are almost always scoped,
      # e.g. "chore(deps): ..." from Renovate.
      - '^(docs|test|chore)(\(.+\))?!?:'
      - "typo"
  groups:
    - title: Breaking changes
      regexp: '^[a-z]+(\([^)]+\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\([^)]+\))?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\([^)]+\))?:'
      order: 2
    - title: Other
      order: 999

signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

release:
  name_template: "{{.Tag}}"
  # The archives are binary-only and cannot carry extra files, so the project
  # licence and the third-party notices (Apache-2.0 and BSD-3-Clause require
  # them with the binary) travel with the release itself.
  extra_files:
    - glob: LICENSE.md
    - glob: third_party/THIRD_PARTY_LICENSES.txt
  # Quoted, not a folded block: yamlfmt reads a `---` line in a block scalar as
  # a document separator.
  footer: "\n---\nReleased by [GoReleaser](https://github.com/goreleaser/goreleaser)."
