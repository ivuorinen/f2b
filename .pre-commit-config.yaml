---
# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
# Require at least the feature set shipped with pre-commit 3.4
minimum_pre_commit_version: "3.4.0"

# Generated API docs (produced by `make docs-api`) and the vendored graphify
# skill (a third-party tool install under .claude/skills/) must not be linted,
# reformatted, or whitespace-fixed by any hook.
exclude: ^(docs/api/|\.claude/skills/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.4
    hooks:
      - id: sync-pre-commit-deps

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run
        language: system
        types: [go]
        pass_filenames: false

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
        exclude: ^docs/(api|audit)/ # generated (docs/api) / machine-managed (docs/audit) markdown

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.14.2
    hooks:
      - id: markdown-link-check
        args: [-q, -c, .markdown-link-check.json]
        stages: [manual] # Network-dependent; run with `pre-commit run --hook-stage manual`

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt

  - repo: https://github.com/checkmake/checkmake
    rev: v0.3.2
    hooks:
      - id: checkmake
        name: Makefile Linter
        files: ^Makefile$

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: "3.3.8"
    hooks:
      - id: checkov
        args:
          - "--quiet"

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]

  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.8.0
    hooks:
      - id: editorconfig-checker
        exclude: ^docs/(api|audit)/ # generated (docs/api) / machine-managed (docs/audit)

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
        exclude: ^(\.serena/|\.github/ISSUE_TEMPLATE/|docs/(api|audit)/)
