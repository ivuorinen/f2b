---
# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
# Require at least the feature set shipped with pre-commit 3.4
minimum_pre_commit_version: "3.4.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.4
    hooks:
      - id: sync-pre-commit-deps

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1 run
        language: system
        types: [go]
        pass_filenames: false

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.json, --fix]

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.14.2
    hooks:
      - id: markdown-link-check
        args: [-q, -c, .markdown-link-check.json]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ["-shellcheck="]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt

  - repo: https://github.com/checkmake/checkmake
    rev: v0.3.2
    hooks:
      - id: checkmake
        name: Makefile Linter
        files: ^Makefile$

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: "3.3.1"
    hooks:
      - id: checkov
        args:
          - "--quiet"

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.3
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]

  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.7.0
    hooks:
      - id: editorconfig-checker

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
        exclude: ^(\.serena/|\.github/ISSUE_TEMPLATE/)
